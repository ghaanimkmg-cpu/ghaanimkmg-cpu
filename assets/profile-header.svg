<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Orb Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #a5b4fc; letter-spacing: 1px; text-transform: uppercase; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #94a3b8; }
      
      /* Glassmorphism Panels */
      .glass-panel { fill: rgba(15, 23, 42, 0.4); stroke: rgba(255,255,255,0.08); stroke-width: 1px; backdrop-filter: blur(8px); rx: 12px; }
      .glass-header { fill: rgba(255,255,255,0.03); }
      .code-line { stroke-linecap: round; }
      
      .tiny-text { font-family: "Fira Code", monospace; font-size: 10px; font-weight: 600; fill: #60a5fa; letter-spacing: 1px; }
      
      @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
      @keyframes orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      .orb-1 { animation: float1 15s ease-in-out infinite; }
      .orb-2 { animation: float2 18s ease-in-out infinite; }
      .orb-3 { animation: float1 20s ease-in-out infinite; }
      
      .panel-1 { animation: float1 10s ease-in-out infinite; }
      .panel-2 { animation: float2 12s ease-in-out infinite; }
      .panel-3 { animation: float1 14s ease-in-out infinite; }
      
      .hud-spin { transform-origin: center; animation: orbit 30s linear infinite; }
      .hud-spin-reverse { transform-origin: center; animation: orbit 40s linear infinite reverse; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Orbs -->
  <circle cx="900" cy="150" r="280" fill="url(#orb1)" class="orb-1" />
  <circle cx="1050" cy="300" r="250" fill="url(#orb2)" class="orb-2" />
  <circle cx="700" cy="280" r="220" fill="url(#orb3)" class="orb-3" />

  <!-- Right Side UI / Product Interface (Personalized) -->
  <g transform="translate(680, 50)">
    
    <!-- Connection Lines Backdrop -->
    <path d="M 50 150 L 450 150 M 200 20 L 200 300 M 350 50 L 350 320" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Central HUD Ring -->
    <g transform="translate(250, 160)">
      <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(192, 132, 252, 0.15)" stroke-width="1" stroke-dasharray="2 6" class="hud-spin" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="20 10 5 10" class="hud-spin-reverse" />
    </g>

    <!-- UI Panel 1: Core Stack -->
    <g transform="translate(30, 40)" class="panel-1">
      <rect x="0" y="0" width="240" height="130" class="glass-panel" />
      <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 30 L 0 30 Z" class="glass-header" />
      <circle cx="15" cy="15" r="4" fill="#ef4444" opacity="0.6"/>
      <circle cx="30" cy="15" r="4" fill="#eab308" opacity="0.6"/>
      <circle cx="45" cy="15" r="4" fill="#22c55e" opacity="0.6"/>
      <text x="65" y="19" class="tiny-text" fill="#94a3b8">system/core_stack</text>
      
      <!-- Tech Tags -->
      <rect x="15" y="45" width="70" height="22" fill="rgba(56, 189, 248, 0.15)" rx="4" />
      <text x="50" y="59" class="tiny-text" text-anchor="middle" fill="#38bdf8">React.js</text>
      
      <rect x="95" y="45" width="65" height="22" fill="rgba(52, 211, 153, 0.15)" rx="4" />
      <text x="127.5" y="59" class="tiny-text" text-anchor="middle" fill="#34d399">FastAPI</text>
      
      <rect x="170" y="45" width="55" height="22" fill="rgba(250, 204, 21, 0.15)" rx="4" />
      <text x="197.5" y="59" class="tiny-text" text-anchor="middle" fill="#facc15">Python</text>
      
      <rect x="15" y="80" width="60" height="22" fill="rgba(192, 132, 252, 0.15)" rx="4" />
      <text x="45" y="94" class="tiny-text" text-anchor="middle" fill="#c084fc">MySQL</text>

      <rect x="85" y="80" width="85" height="22" fill="rgba(244, 114, 182, 0.15)" rx="4" />
      <text x="127.5" y="94" class="tiny-text" text-anchor="middle" fill="#f472b6">TailwindCSS</text>
    </g>

    <!-- UI Panel 2: AI Capabilities -->
    <g transform="translate(260, 100)" class="panel-2">
      <rect x="0" y="0" width="210" height="100" class="glass-panel" />
      <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 30 L 0 30 Z" class="glass-header" />
      <text x="15" y="19" class="tiny-text" fill="#94a3b8">module/ai_features</text>
      
      <circle cx="20" cy="52" r="4" fill="#c084fc" />
      <text x="35" y="55" class="tiny-text" fill="#e2e8f0">Gemini AI Integration</text>
      
      <circle cx="20" cy="77" r="4" fill="#38bdf8" />
      <text x="35" y="80" class="tiny-text" fill="#e2e8f0">RAG Vector Systems</text>
    </g>

    <!-- UI Panel 3: Current Focus -->
    <g transform="translate(100, 220)" class="panel-3">
      <rect x="0" y="0" width="280" height="70" class="glass-panel" />
      <rect x="15" y="25" width="4" height="20" fill="#34d399" rx="2" />
      <text x="30" y="34" class="tiny-text" fill="#94a3b8">CURRENT BUILD</text>
      <text x="30" y="52" class="tiny-text" fill="#f8fafc" style="font-size: 12px;">Islamic Knowledge Assistant</text>
      
      <!-- Progress Bar -->
      <rect x="200" y="34" width="60" height="4" fill="rgba(255,255,255,0.1)" rx="2" />
      <rect x="200" y="34" width="40" height="4" fill="#34d399" rx="2" />
    </g>
    
    <!-- Accent Dots -->
    <circle cx="80" cy="150" r="3" fill="#38bdf8" />
    <circle cx="350" cy="150" r="3" fill="#c084fc" />
    <circle cx="200" cy="50" r="3" fill="#38bdf8" />
    <circle cx="450" cy="200" r="3" fill="#34d399" />
  </g>

  <!-- Left Side Text (Identity) -->
  <g transform="translate(80, 190)">
    <!-- Main Name (Clean, crisp, no heavy glow) -->
    <text x="0" y="0" class="title">Mohammed Ghaanim</text>
    
    <!-- Role Subtitle -->
    <text x="0" y="45" class="subtitle">Full Stack Developer <tspan fill="#38bdf8">•</tspan> AI Builder <tspan fill="#38bdf8">•</tspan> Product-minded Creator</text>
    
    <!-- Short Desc -->
    <text x="0" y="85" class="desc">Building practical full-stack and AI-powered</text>
    <text x="0" y="112" class="desc">products with real user flows.</text>
    
    <!-- Decorative Premium Line -->
    <rect x="0" y="145" width="80" height="3" fill="url(#orb1)" rx="1.5" opacity="0.8" />
    <rect x="0" y="145" width="30" height="3" fill="#38bdf8" rx="1.5" />
    <rect x="35" y="145" width="10" height="3" fill="#c084fc" rx="1.5" />
  </g>

  <!-- Clean Border -->
  <rect width="1198" height="418" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" rx="15" />
</svg>

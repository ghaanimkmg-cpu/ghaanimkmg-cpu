<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Orb Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #94a3b8; letter-spacing: 1px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #64748b; }
      
      .tag-bg { fill: rgba(30, 41, 59, 0.5); stroke: rgba(51, 65, 85, 0.5); stroke-width: 1px; rx: 6px; }
      .tag-text { font-family: "Fira Code", monospace; font-size: 14px; font-weight: 500; fill: #38bdf8; }
      .tag-text-purple { fill: #c084fc; }
      .tag-text-green { fill: #34d399; }
      
      @keyframes float1 { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-20px) translateX(10px); } }
      @keyframes float2 { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(20px) translateX(-15px); } }
      @keyframes float3 { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      
      .orb-1 { animation: float1 15s ease-in-out infinite; }
      .orb-2 { animation: float2 18s ease-in-out infinite; }
      .orb-3 { animation: float3 20s ease-in-out infinite; }
      .glow-pulse { animation: pulse 4s ease-in-out infinite; }
      .code-float-1 { animation: float1 8s ease-in-out infinite; }
      .code-float-2 { animation: float2 10s ease-in-out infinite; }
      .code-float-3 { animation: float3 9s ease-in-out infinite; }
      .code-float-4 { animation: float1 11s ease-in-out infinite; }
      .code-float-5 { animation: float2 12s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Orbs -->
  <circle cx="900" cy="100" r="250" fill="url(#orb1)" class="orb-1" />
  <circle cx="1050" cy="300" r="300" fill="url(#orb2)" class="orb-2" />
  <circle cx="700" cy="250" r="200" fill="url(#orb3)" class="orb-3" />

  <!-- Abstract Graphic / Tech Visuals (Right Side) -->
  <g transform="translate(750, 60)">
    <!-- Main Center Core -->
    <circle cx="180" cy="150" r="80" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="2" class="glow-pulse"/>
    <circle cx="180" cy="150" r="60" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0 180 150" to="360 180 150" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="150" r="40" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
    <path d="M 165 150 L 195 150 M 180 135 L 180 165" stroke="rgba(56, 189, 248, 0.8)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Floating Tech Badges -->
    <g transform="translate(250, 40)" class="code-float-1">
      <rect x="0" y="0" width="80" height="32" class="tag-bg" />
      <text x="40" y="21" class="tag-text" text-anchor="middle">&lt;API /&gt;</text>
    </g>

    <g transform="translate(60, 20)" class="code-float-2">
      <rect x="0" y="0" width="70" height="32" class="tag-bg" />
      <text x="35" y="21" class="tag-text tag-text-purple" text-anchor="middle">RAG</text>
    </g>

    <g transform="translate(20, 220)" class="code-float-3">
      <rect x="0" y="0" width="80" height="32" class="tag-bg" />
      <text x="40" y="21" class="tag-text tag-text-green" text-anchor="middle">AUTH</text>
    </g>

    <g transform="translate(260, 200)" class="code-float-4">
      <rect x="0" y="0" width="105" height="32" class="tag-bg" />
      <text x="52.5" y="21" class="tag-text" text-anchor="middle">DASHBOARD</text>
    </g>

    <g transform="translate(130, 260)" class="code-float-5">
      <rect x="0" y="0" width="100" height="32" class="tag-bg" />
      <text x="50" y="21" class="tag-text tag-text-purple" text-anchor="middle">DATABASE</text>
    </g>

    <g transform="translate(110, -20)" class="code-float-3">
      <rect x="0" y="0" width="190" height="32" fill="rgba(52, 211, 153, 0.1)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" rx="16" />
      <text x="95" y="21" class="tag-text tag-text-green" text-anchor="middle">BUILD → TEST → SHIP</text>
    </g>

    <!-- Connection Lines -->
    <path d="M 180 90 L 180 50" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 240 150 L 280 150" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 120 150 L 80 150" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 180 210 L 180 250" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2 2" />
  </g>

  <!-- Left Side Text (Identity) -->
  <g transform="translate(80, 190)">
    <text x="0" y="0" class="title" filter="url(#glow)">Mohammed Ghaanim</text>
    <text x="0" y="45" class="subtitle">Full Stack Developer • AI Builder • Product-minded Creator</text>
    <text x="0" y="90" class="desc">Building practical full-stack and AI-powered products with real user flows.</text>
    
    <!-- Decorative Line -->
    <rect x="0" y="115" width="60" height="4" fill="#38bdf8" rx="2" />
    <rect x="68" y="115" width="12" height="4" fill="#c084fc" rx="2" />
  </g>

  <!-- Border -->
  <rect width="1198" height="418" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" rx="15" />
</svg>
